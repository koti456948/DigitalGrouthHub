<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - DigitalGrowth</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #f9fafb; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #111827; }
        .container { background: #ffffff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); width: 100%; max-width: 400px; }
        
        .header { text-align: center; margin-bottom: 30px; }
        .header h2 { font-size: 24px; font-weight: 600; margin-bottom: 8px; color: #111827; }
        .header p { font-size: 14px; color: #6b7280; line-height: 1.5; }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; font-weight: 500; color: #374151; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 12px; font-size: 14px; border: 1px solid #d1d5db; border-radius: 6px; outline: none; transition: 0.2s; }
        .form-group input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }

        .submit-btn { width: 100%; background-color: #2563eb; color: white; padding: 12px; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .submit-btn:hover { background-color: #1d4ed8; }

        .footer-links { text-align: center; margin-top: 25px; font-size: 13px; color: #6b7280; }
        .footer-links a { color: #2563eb; text-decoration: none; font-weight: 500; }
        .footer-links a:hover { text-decoration: underline; }

        /* --- Updated Flash Message Styles --- */
        .flash-container { margin-bottom: 20px; }
        .flash-message { 
            padding: 12px; 
            border-radius: 6px; 
            font-size: 13px; 
            text-align: center; 
            margin-bottom: 10px;
            font-weight: 500;
        }
        /* Error messages (default) */
        .error { background-color: #fee2e2; color: #b91c1c; border: 1px solid #f87171; }
        /* Success messages */
        .success { background-color: #d1fae5; color: #065f46; border: 1px solid #34d399; }
    </style>
</head>
<body>
    <div class="container">
        <div class="flash-container">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="flash-message {% if 'Error' in message or 'error' in category %}error{% else %}success{% endif %}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
        </div>

        <div class="header">
            <h2>Forgot Password</h2>
            <p>Enter your registered email to receive a 6-digit OTP.</p>
        </div>

        <form method="POST" action="/forgot-password">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
            </div>
            <button type="submit" class="submit-btn">Send OTP</button>
            <div class="footer-links">
                <a href="/login">← Back to Login</a>
            </div>
        </form>
    </div>
</body>
</html>
