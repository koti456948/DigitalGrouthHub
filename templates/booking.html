<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Service - DigitalGrowth Hub</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        /* --- GLOBAL RESET --- */
        * {
            margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth;
        }

        :root {
            --bg-deep: #020617; 
            --primary-glow: #38bdf8; 
            --accent-glow: #c084fc; 
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: rgba(2, 6, 23, 0.6);
        }

        body {
            color: var(--text-main);
            background: var(--bg-deep);
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        h1, h2, h3 { font-family: 'Outfit', sans-serif; }

        /* --- PREMIUM BACKGROUND GLOW ORBS --- */
        .bg-orbs {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; pointer-events: none; overflow: hidden;
            background: radial-gradient(circle at 15% 20%, rgba(56, 189, 248, 0.12) 0%, transparent 40%),
                        radial-gradient(circle at 85% 80%, rgba(192, 132, 252, 0.12) 0%, transparent 40%);
        }

        /* --- BOOKING CARD (GLASSMORPHISM) --- */
        .booking-container {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 50px 45px;
            border-radius: 30px;
            width: 100%;
            max-width: 550px;
            position: relative;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(255, 255, 255, 0.02);
            animation: formFadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes formFadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Top Glowing Edge */
        .booking-container::before {
            content: ''; position: absolute; top: 0; left: 10%; width: 80%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary-glow), var(--accent-glow), transparent);
            opacity: 0.8;
        }

        .header-text { text-align: center; margin-bottom: 40px; }
        
        .header-text h2 {
            color: #fff; font-size: 36px; font-weight: 700; margin-bottom: 10px; letter-spacing: -1px;
        }
        
        .header-text p { color: var(--text-muted); font-size: 15px; line-height: 1.6; }

        /* --- INPUT FIELDS DESIGN --- */
        .input-group { margin-bottom: 25px; position: relative; }

        .input-group label {
            display: block; margin-bottom: 10px; color: #cbd5e1;
            font-weight: 500; font-size: 13px; text-transform: uppercase; letter-spacing: 1px;
        }

        .input-icon {
            position: absolute; left: 18px; top: 43px;
            color: #64748b; font-size: 16px; transition: 0.3s;
        }

        .input-group input, .input-group textarea {
            width: 100%; padding: 15px 15px 15px 50px;
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 14px;
            outline: none; font-size: 15px; color: #fff;
            background-color: var(--input-bg);
            transition: all 0.3s ease; font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .input-group textarea { padding: 15px 20px; resize: vertical; min-height: 100px; }

        /* Focus Effects */
        .input-group input:focus, .input-group textarea:focus {
            border-color: var(--primary-glow);
            background-color: rgba(2, 6, 23, 0.9);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
        }

        .input-group input:focus + .input-icon { color: var(--primary-glow); }

        /* Readonly field (Selected Service) */
        .input-group input[readonly] {
            background-color: rgba(255, 255, 255, 0.03);
            color: var(--primary-glow);
            border-color: rgba(56, 189, 248, 0.3);
            cursor: not-allowed; font-weight: 600;
        }
        
        .input-group input[readonly] + .input-icon { color: var(--primary-glow); }

        /* Date Picker Customization */
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1); cursor: pointer; opacity: 0.6; transition: 0.3s;
        }
        input[type="date"]::-webkit-calendar-picker-indicator:hover { opacity: 1; }

        /* --- SUBMIT BUTTON --- */
        .book-btn {
            width: 100%; padding: 18px; margin-top: 15px;
            background: linear-gradient(135deg, var(--primary-glow) 0%, #2563eb 100%);
            color: white; border: none; border-radius: 14px;
            cursor: pointer; font-size: 16px; font-weight: 600; font-family: 'Outfit', sans-serif;
            letter-spacing: 0.5px; transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(56, 189, 248, 0.3);
            display: flex; justify-content: center; align-items: center; gap: 10px;
        }

        .book-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(56, 189, 248, 0.5);
            background: linear-gradient(135deg, #7dd3fc 0%, #3b82f6 100%);
        }

        /* --- BACK LINK --- */
        .back-link {
            display: flex; justify-content: center; align-items: center; gap: 8px;
            margin-top: 30px; color: var(--text-muted); text-decoration: none;
            font-size: 14px; font-weight: 500; transition: 0.3s;
        }

        .back-link:hover { color: #fff; }

        /* --- RESPONSIVE --- */
        @media (max-width: 600px) {
            .booking-container { padding: 40px 25px; }
            .header-text h2 { font-size: 30px; }
        }
    </style>
</head>
<body>

    <div class="bg-orbs"></div>

    <div class="booking-container">
        <div class="header-text">
            <h2>Book Your Strategy Session</h2>
            <p>Fill out the details below and our growth experts will contact you shortly to lock in your slot.</p>
        </div>
        
        <form method="POST" action="/book">
            
            <div class="input-group">
                <label for="serviceName">Selected Module</label>
                <input type="text" id="serviceName" name="serviceName" value="{{ service_name }}" readonly required>
                <i class="fas fa-cube input-icon"></i>
            </div>
            
            <div class="input-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="E.g., Rajesh Kumar" required>
                <i class="fas fa-user input-icon"></i>
            </div>
            
            <div class="input-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="+91 XXXXX XXXXX" required>
                <i class="fas fa-phone-alt input-icon"></i>
            </div>

            <div class="input-group">
                <label for="date">Preferred Date</label>
                <input type="date" id="date" name="date" required>
                <i class="fas fa-calendar-alt input-icon"></i>
            </div>

            <div class="input-group">
                <label for="message">Business Context (Optional)</label>
                <textarea id="message" name="message" placeholder="Briefly describe your current business challenges or goals..."></textarea>
            </div>
            
            <button type="submit" class="book-btn">Confirm Booking <i class="fas fa-arrow-right"></i></button>
            
            <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> Return to Dashboard</a>
        </form>
    </div>

</body>
</html>
