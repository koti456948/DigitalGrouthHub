<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DigitalGrowth Hub</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        /* --- GLOBAL RESET --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        /* --- BACKGROUND --- */
        body {
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background: linear-gradient(-45deg, #020617, #0f172a, #1e1b4b, #082f49);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            position: relative;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- FLASH MESSAGES --- */
        .flash-message {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(244, 67, 54, 0.9); /* Red for errors */
            backdrop-filter: blur(10px);
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            text-align: center;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            font-weight: 500;
            font-size: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            animation: slideDown 0.5s ease;
        }

        .flash-success {
            background: rgba(16, 185, 129, 0.9); /* Green for success */
        }

        @keyframes slideDown {
            from { top: -50px; opacity: 0; }
            to { top: 20px; opacity: 1; }
        }

        /* --- LOGIN BOX (GLASSMORPHISM) --- */
        .login-box {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(56, 189, 248, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-box h2 {
            margin-bottom: 30px;
            font-size: 32px;
            font-weight: 600;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }

        /* --- FLOATING INPUT FIELDS --- */
        .input-group {
            position: relative;
            margin-bottom: 25px;
            text-align: left;
        }

        .input-group input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            outline: none;
            color: white;
            font-size: 15px;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
            background: rgba(0, 0, 0, 0.4);
        }

        /* Input Icons */
        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 18px;
            transition: 0.3s;
        }

        .input-group input:focus + .input-icon,
        .input-group input:valid + .input-icon {
            color: #38bdf8;
        }

        /* Floating Label */
        .input-group label {
            position: absolute;
            left: 45px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 15px;
            pointer-events: none;
            transition: 0.3s;
        }

        /* Float animation when focused or filled */
        .input-group input:focus ~ label,
        .input-group input:valid ~ label {
            top: -10px;
            left: 10px;
            font-size: 12px;
            color: #38bdf8;
            background: #0f172a;
            padding: 0 5px;
            border-radius: 3px;
        }

        /* Toggle Password Icon */
        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #94a3b8;
            transition: 0.3s;
            font-size: 18px;
            z-index: 10;
        }

        .toggle-password:hover {
            color: #38bdf8;
        }

        /* --- LINKS & BUTTONS --- */
        .forgot-pass {
            text-align: right;
            margin-top: -10px;
            margin-bottom: 25px;
        }

        .forgot-pass a {
            color: #cbd5e1;
            font-size: 13px;
            text-decoration: none;
            transition: 0.3s;
        }

        .forgot-pass a:hover {
            color: #38bdf8;
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, #38bdf8, #6366f1);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: 0.4s ease;
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 25px rgba(99, 102, 241, 0.5);
        }

        .links {
            margin-top: 25px;
            font-size: 14px;
            color: #94a3b8;
        }

        .links a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 500;
            margin-left: 5px;
            transition: 0.3s;
        }

        .links a:hover {
            color: #818cf8;
            text-decoration: underline;
        }

        .back-home {
            position: absolute;
            top: 30px;
            left: 40px;
            color: #cbd5e1;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }

        .back-home:hover {
            color: #38bdf8;
            transform: translateX(-5px);
        }
    </style>
</head>
<body>

    <a href="/" class="back-home"><i class="fas fa-arrow-left"></i> Back to Home</a>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <div class="flash-message {% if 'Success' in message %}flash-success{% endif %}">
              {{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <div class="login-box">
        <h2>Welcome Back</h2>
        
        <form method="POST" action="/login">
            
            <div class="input-group">
                <input type="email" id="email" name="email" required>
                <i class="fas fa-envelope input-icon"></i>
                <label for="email">Email Address</label>
            </div>
            
            <div class="input-group">
                <input type="password" id="password" name="password" required>
                <i class="fas fa-lock input-icon"></i>
                <label for="password">Password</label>
                <i class="fas fa-eye toggle-password" id="togglePassword"></i>
            </div>
            
            <div class="forgot-pass">
                <a href="/forgot-password">Forgot Password?</a>
            </div>
            
            <button type="submit" class="login-btn">Sign In</button>
            
            <div class="links">
                Don't have an account? <a href="/signup">Sign Up</a>
            </div>
        </form>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const togglePassword = document.getElementById('togglePassword');
            const password = document.getElementById('password');

            togglePassword.addEventListener('click', function () {
                // Toggle the type attribute
                const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
                password.setAttribute('type', type);
                
                // Toggle the eye / eye-slash icon class
                this.classList.toggle('fa-eye');
                this.classList.toggle('fa-eye-slash');
            });
        });
    </script>

</body>
</html>
